<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Cash Flow — CF icon</title>
  <desc>Three wave fill bands with CF monogram knockout on green rounded square</desc>

  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="24" fill="#1E9E3E"/>

  <!-- Wave fill bands — closed filled shapes, ascending opacity front to back -->

  <!-- Bottom band (faintest) -->
  <path d="M0 90 C20 72 40 72 60 90 C80 108 100 108 120 90 L120 120 L0 120 Z"
        fill="white" opacity="0.12"/>

  <!-- Mid band -->
  <path d="M0 76 C20 56 40 56 60 76 C80 96 100 96 120 76 L120 96 C100 116 80 116 60 96 C40 76 20 76 0 96 Z"
        fill="white" opacity="0.22"/>

  <!-- Top band (boldest) -->
  <path d="M0 58 C20 38 40 38 60 58 C80 78 100 78 120 58 L120 78 C100 98 80 98 60 78 C40 58 20 58 0 78 Z"
        fill="white" opacity="0.35"/>

  <!-- CF monogram — centered, knocked out in white -->
  <text x="60" y="74"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="42"
        font-weight="500"
        fill="white"
        letter-spacing="-1">CF</text>
</svg>
